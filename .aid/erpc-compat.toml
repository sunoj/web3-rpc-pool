name = "trusted-endpoint"
agent = "codex"
dir = "/Users/mingsun/Develop/web3/web3-rpc-pool"
worktree = "feat/erpc-compat"
verify = "cargo test"
prompt = """
Add "trusted endpoint" support to web3-rpc-pool. This is for when the endpoint is a local load balancer (like eRPC) that already handles failover, health checks, and retries internally — so web3-rpc-pool should skip its own redundant checks.

## Changes needed:

### 1. `src/tiered.rs` — TieredEndpoint + TieredPool + TieredPoolBuilder

**TieredEndpoint**: Add a `trusted: bool` field (default false):
```rust
pub struct TieredEndpoint {
    pub endpoint: RpcEndpoint,
    pub tier: EndpointTier,
    pub rate_limit: u32,
    pub trusted: bool,  // NEW
}
```
Update `TieredEndpoint::new()` to set `trusted: false`.

**TieredPool**:
- Add a new field `trusted_urls: HashMap<EndpointTier, url::Url>` to store trusted tier URLs.
- In `TieredPool::new()`: when building, if ALL endpoints in a tier have `trusted: true`, don't create an RpcPool for that tier. Instead, parse the first endpoint's URL and store it in `trusted_urls`.
- Modify `execute()`: before trying `pool.execute()`, check if the tier has a trusted URL. If so, call `f(url)` directly wrapped in `tokio::time::timeout(Duration::from_secs(30))`. On timeout, return `RpcPoolError::AllEndpointsFailed`. On success, return immediately. On error, log warning and fall through to next tier (same as current behavior).
- Add method `pub fn trusted_url(&self, priority: RequestPriority) -> Option<url::Url>` that returns the trusted URL for the first tier in the priority's tier order that has a trusted URL. Returns None if no trusted tier matches.

**TieredPoolBuilder**: Add three new builder methods:
```rust
pub fn add_premium_trusted(mut self, url: impl Into<String>, name: impl Into<String>) -> Self
pub fn add_standard_trusted(mut self, url: impl Into<String>, name: impl Into<String>) -> Self
pub fn add_free_trusted(mut self, url: impl Into<String>, name: impl Into<String>) -> Self
```
These work like `add_premium/add_standard/add_free` but set `trusted: true`.

### 2. `src/tiered.rs` — TieredPoolBuilder: skip_default_presets option

Add a `skip_default_presets: bool` field to `TieredPoolBuilder` (default false).
Add builder method:
```rust
pub fn skip_default_presets(mut self, skip: bool) -> Self
```

This flag is NOT enforced inside web3-rpc-pool itself — it's just stored and exposed via:
```rust
pub fn should_skip_default_presets(&self) -> bool
```

The caller (smart-router's setup.rs) reads this flag to decide whether to call `add_free_endpoints()`. This keeps the logic in the caller where the presets::default_endpoints() call happens.

Wait — actually that doesn't work because build() consumes self. Instead, just add a field directly to `TieredPool`:
```rust
pub struct TieredPool {
    pools: HashMap<EndpointTier, Arc<RpcPool>>,
    trusted_urls: HashMap<EndpointTier, url::Url>,
    allow_critical_fallback: bool,
    allow_low_escalation: bool,
    has_trusted_free: bool,  // NEW: true if Free tier has a trusted endpoint
}
```
And expose `pub fn has_trusted_free(&self) -> bool`. The caller can check this BEFORE calling `add_free_endpoints()`.

Actually simpler approach: just add a method to `TieredPoolBuilder`:
```rust
pub fn skip_default_presets(mut self, skip: bool) -> Self {
    self.skip_default_presets = skip;
    self
}
```
And in `build()`, store it in the TieredPool so callers don't need it. But really the caller needs this BEFORE build().

Simplest approach: The builder already has `add_free_endpoints()` and `with_default_free_endpoints()`. Just DON'T call these methods when a trusted free endpoint is configured. The caller controls this. No new flag needed in web3-rpc-pool.

So: SKIP direction 3 inside web3-rpc-pool. The caller (SR) will just not call `add_free_endpoints(presets)` when it has a trusted Free URL.

