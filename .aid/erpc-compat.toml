- `test_mixed_trusted_and_pool`: build pool with trusted premium + non-trusted free, verify both work
- `test_trusted_tier_no_pool_created`: build with trusted standard, verify `get_tier_pool(Standard)` returns None but trusted_url works

### Important constraints:
- Do NOT modify pool.rs, endpoint.rs, strategies/, presets.rs, or error.rs
- Only modify src/tiered.rs
- Keep all existing tests passing
- Use `url::Url` (already in Cargo.toml deps) for trusted_urls
- The 30s timeout for trusted execute should use `tokio::time::timeout`
"""

