Update smart-router to use web3-rpc-pool's new "trusted endpoint" feature when eRPC URLs are configured.

## Context:
web3-rpc-pool now supports "trusted endpoints" — endpoints that are local load balancers (eRPC) that handle their own failover. When a tier has a trusted endpoint, web3-rpc-pool skips its internal health checks and failover, just passing through requests directly.

## Changes:

### 1. `crates/sr-service/src/setup.rs` — `build_rpc_pools()`

When env vars point to eRPC (localhost:4000), use trusted builder methods:

Replace the current pattern:
```rust
builder = builder.add_premium(url.to_string(), name);
```

With detection logic:
```rust
fn is_erpc_url(url: &str) -> bool {
    url.contains("127.0.0.1:4000") || url.contains("localhost:4000")
}

// In the env var loop:
if is_erpc_url(url) {
    builder = builder.add_premium_trusted(url.to_string(), name);
} else {
    builder = builder.add_premium(url.to_string(), name);
}
```

Apply the same pattern for standard and free tiers.

When the Free tier has a trusted endpoint (eRPC free URL), skip adding preset endpoints:
```rust
// After processing env vars, before adding presets:
let has_trusted_free = /* check if any free endpoint was added as trusted */;
if !has_trusted_free {
    let preset_endpoints = web3_rpc_pool::presets::default_endpoints(cc.chain_id);
    endpoint_count += preset_endpoints.len() as u32;
    builder = builder.add_free_endpoints(preset_endpoints);
}
```

Track whether a trusted free was added with a local `bool` variable set during the env var processing loop.

