# web3-rpc-pool: eRPC compatibility options
# Three features that eliminate redundancy when using eRPC as the backend.
#
# All three are opt-in via TieredPoolBuilder methods:
#   .add_premium_trusted(url, name)   — trusted mode, skip pool failover + health check
#   .skip_default_presets(true)       — don't add preset free endpoints
#   .trusted_url(priority)            — return URL without probe (for healthy_url callers)

