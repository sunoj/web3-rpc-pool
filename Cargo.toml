# Standalone workspace boundary so parent workspaces that include this
# crate as a path dependency don't recurse into it for `cargo fmt --all`,
# `cargo check --workspace`, etc.
[workspace]

[package]
name = "web3-rpc-pool"
version = "0.5.9"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "High-availability multi-endpoint RPC pool with automatic failover and load balancing for Web3 applications"
repository = "https://github.com/sunoj/web3-rpc-pool"
keywords = ["web3", "rpc", "ethereum", "failover", "load-balancing"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["http", "ws"]
http = []
ws = ["alloy/provider-ws", "alloy/rpc-types"]
metrics = ["prometheus"]
evaluator = ["dep:clap", "dep:chrono"]
live-tests = []

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Alloy for RPC. We deliberately do NOT enable alloy's "reqwest-rustls-tls"
# feature: reqwest 0.12.28 redefined its "rustls" feature to select the
# aws-lc-rs provider (formerly ring), which drags in aws-lc-sys — a
# cross-compile-hostile C/asm build. Instead we pull plain "reqwest" and pin
# the TLS provider to ring via our own reqwest dependency below. This keeps the
# HTTP transport (TieredPool) cross-compile clean on any alloy version.
#
# NOTE: the optional `ws` feature pulls alloy-transport-ws, which since alloy
# 1.7.4 hard-codes rustls "aws_lc_rs" (not feature-gated) and reintroduces
# aws-lc-sys. It cannot be fixed from here without pinning the entire alloy
# stack (the sub-crates are not lockstep-versioned, so a cap only skews them).
# Consumers that need WS AND cross-compile should pin the alloy stack to
# <=1.7.3 or patch alloy-transport-ws. HTTP-only consumers are unaffected.
alloy = { version = "1.0", default-features = false, features = ["providers", "transports", "rpc-client", "transport-http", "reqwest"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
parking_lot = "0.12"
url = "2"
futures-util = "0.3"

# Logging
tracing = "0.1"

# Optional: Metrics
prometheus = { version = "0.13", optional = true }

# Error handling
thiserror = "2"

# reqwest provides the TLS backend for alloy's HTTP transport. Pin it to the
# ring-backed rustls provider (default-features off drops native-tls) so the
# whole tree resolves to ring and aws-lc-rs/aws-lc-sys is never compiled.
# Non-optional: alloy's transport-http needs a reqwest TLS provider regardless.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
rand = "0.8"
wiremock = "0.6"

[[bin]]
name = "rpc-evaluator"
path = "src/bin/rpc_evaluator.rs"
required-features = ["evaluator"]

[[bench]]
name = "pool_benchmarks"
harness = false

[[bench]]
name = "strategy_benchmarks"
harness = false
