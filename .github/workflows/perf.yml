name: Performance Tests

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Run criterion benchmarks
        run: |
          cargo bench --bench strategy_benchmarks -- --noplot | tee bench_strategy.log
          cargo bench --bench pool_benchmarks -- --noplot | tee bench_pool.log

      - name: Run integration performance tests
        run: cargo test --release --test perf_tests -- --ignored --nocapture | tee perf_tests.log

      - name: Generate performance report
        run: |
          mkdir -p perf-results
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          GIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")

          cat > perf-results/report_${VERSION}_${TIMESTAMP}.md << EOF
          # Performance Report

          - **Version:** $VERSION
          - **Git Hash:** $GIT_HASH
          - **Date:** $(date -Iseconds)
          - **Runner:** ${{ runner.os }}

          ## Strategy Benchmarks

          \`\`\`
          $(grep -E "(select/|time:)" bench_strategy.log | head -40)
          \`\`\`

          ## Pool Benchmarks

          \`\`\`
          $(grep -E "(pool_|preset_|time:)" bench_pool.log | head -40)
          \`\`\`

          ## Integration Tests

          \`\`\`
          $(grep -E "^(===|  [A-Za-z])" perf_tests.log)
          \`\`\`
          EOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            bench_*.log
            perf_tests.log
            perf-results/
          retention-days: 30
